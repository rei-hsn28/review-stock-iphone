<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#235f4c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="復習ストック">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <title>復習ストック</title>
  <script>
    try {
      const savedTheme = localStorage.getItem('review-stock-theme-mode-v1');
      const dark = savedTheme === 'dark' || (savedTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch {}
  </script>
  <style>
    :root {
      color-scheme: light;
      --ink: #232c2b;
      --muted: #79817d;
      --line: #e8e7df;
      --paper: #fffefa;
      --canvas: #f7f6f2;
      --green: #235f4c;
      --green-dark: #174b3b;
      --green-pale: #e8f0e9;
      --amber: #a56624;
      --amber-pale: #fff1db;
      --control-bg: #fff;
      --control-border: #dcded6;
      --soft-surface: #f0f1ed;
      --soft-ink: #59635e;
      --track: #eeeee8;
      --inactive-lamp: #e6e8e2;
      --progress-start: #75a98a;
      --progress-end: #347455;
      --priority-low-surface: #f8fbf9;
      --priority-low-border: #e6eee8;
      --priority-medium-surface: #fffdf8;
      --priority-medium-border: #eee9dc;
      --priority-high-surface: #fff9f8;
      --priority-high-border: #f0e4e1;
      --low-text: #27697d;
      --low-bg: #eaf3f5;
      --low-border: #c8e0e5;
      --medium-text: #93651d;
      --medium-bg: #fff3dc;
      --medium-border: #f0dbb4;
      --high-text: #9a463e;
      --high-bg: #faece9;
      --high-border: #edc8c2;
      --shadow: 0 14px 36px rgba(41, 48, 42, .055);
      font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --ink: #e6ece8;
      --muted: #a2ada7;
      --line: #35423c;
      --paper: #1d2622;
      --canvas: #111815;
      --green: #80b898;
      --green-dark: #9acdad;
      --green-pale: #26392f;
      --amber: #e1b969;
      --amber-pale: #3a2e1d;
      --control-bg: #18211d;
      --control-border: #45534b;
      --soft-surface: #2b3630;
      --soft-ink: #c2cbc5;
      --track: #303a34;
      --inactive-lamp: #3b4740;
      --progress-start: #5e9e79;
      --progress-end: #78bd91;
      --priority-low-surface: #192420;
      --priority-low-border: #30443a;
      --priority-medium-surface: #24231d;
      --priority-medium-border: #48402c;
      --priority-high-surface: #281f1d;
      --priority-high-border: #4b302b;
      --low-text: #a2d3df;
      --low-bg: #21343a;
      --low-border: #35535b;
      --medium-text: #e2c27d;
      --medium-bg: #3b3324;
      --medium-border: #59492c;
      --high-text: #e5a29a;
      --high-bg: #3c2927;
      --high-border: #5c3935;
      --shadow: 0 14px 36px rgba(0, 0, 0, .22);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(1060px, calc(100% - 40px)); margin: 0 auto; padding: 48px 0 72px; }
    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 28px; }
    .eyebrow { color: var(--green); font-size: 12px; font-weight: 800; letter-spacing: .12em; margin: 0 0 9px; }
    h1 { font-size: clamp(29px, 4vw, 38px); line-height: 1.2; letter-spacing: -.04em; margin: 0; }
    .subtitle { color: var(--muted); margin: 10px 0 0; font-size: 14px; }
    .header-actions { display: flex; align-items: center; gap: 7px; }
    .header-icon { display: grid; place-items: center; width: 38px; height: 38px; padding: 0; border: 1px solid var(--line); border-radius: 11px; background: var(--paper); color: var(--soft-ink); }
    .header-icon:hover { border-color: var(--green); color: var(--green); }
    .header-icon svg { width: 18px; height: 18px; }
    .header-icon svg[hidden] { display: none; }
    .local-note { flex: 0 0 auto; color: var(--muted); font-size: 12px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); }
    .subject-progress { margin-bottom: 25px; }
    .progress-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 11px; }
    .progress-heading h2 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
    .progress-heading p { margin: 0; color: var(--muted); font-size: 11px; }
    .progress-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .progress-card { min-width: 0; padding: 14px 15px; background: var(--paper); border: 1px solid var(--line); border-radius: 15px; box-shadow: var(--shadow); }
    .progress-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .progress-subject { font-size: 12px; line-height: 1.5; font-weight: 750; }
    .progress-left { flex: 0 0 auto; color: var(--green); font-size: 12px; font-weight: 750; white-space: nowrap; }
    .progress-left.done { color: var(--muted); }
    .progress-track { height: 7px; margin-top: 10px; overflow: hidden; border-radius: 999px; background: var(--track); }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--progress-start), var(--progress-end)); transition: width .2s ease; }
    .progress-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 7px; color: var(--muted); font-size: 10px; }
    .composer { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 19px; box-shadow: var(--shadow); margin-bottom: 25px; }
    .composer-top { display: flex; align-items: center; gap: 12px; }
    .composer-title { font-size: 14px; font-weight: 750; white-space: nowrap; }
    select, .search { background: var(--control-bg); color: var(--ink); border: 1px solid var(--control-border); outline: 0; }
    select { height: 42px; border-radius: 11px; padding: 0 34px 0 12px; max-width: 290px; }
    select:focus, .search:focus, .topic-input:focus { border-color: #6b9b83; box-shadow: 0 0 0 3px rgba(35,95,76,.1); }
    .input-row { display: flex; gap: 9px; margin-top: 13px; }
    .topic-input { flex: 1; min-width: 0; height: 48px; padding: 0 14px; border: 1px solid var(--control-border); border-radius: 12px; outline: 0; background: var(--control-bg); color: var(--ink); }
    .topic-input::placeholder { color: var(--muted); }
    .add-btn, .review-btn { border: 0; background: var(--green); color: #fff; font-weight: 700; border-radius: 12px; transition: background .15s, transform .15s; }
    .add-btn { padding: 0 19px; height: 48px; white-space: nowrap; }
    .add-btn:hover, .review-btn:hover { background: var(--green-dark); }
    .add-btn:active, .review-btn:active { transform: scale(.98); }
    .hint { color: var(--muted); font-size: 11px; margin: 9px 0 0 2px; }
    .priority-picker { display: flex; align-items: center; gap: 7px; margin-top: 12px; }
    .priority-label { margin-right: 2px; color: var(--muted); font-size: 11px; }
    .priority-option { height: 34px; min-width: 48px; padding: 0 11px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: var(--control-bg); font-size: 12px; }
    .priority-option:hover { border-color: var(--muted); }
    .priority-option.active[data-priority-choice="low"] { color: var(--low-text); background: var(--low-bg); border-color: var(--low-border); font-weight: 750; }
    .priority-option.active[data-priority-choice="medium"] { color: var(--medium-text); background: var(--medium-bg); border-color: var(--medium-border); font-weight: 750; }
    .priority-option.active[data-priority-choice="high"] { color: var(--high-text); background: var(--high-bg); border-color: var(--high-border); font-weight: 750; }
    .list-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 13px; }
    .list-title { margin: 0; font-size: 19px; letter-spacing: -.025em; }
    .list-caption { color: var(--muted); font-size: 12px; margin: 5px 0 0; }
    .list-tools { display: flex; gap: 8px; }
    .list-tools select { width: 180px; height: 38px; border-radius: 10px; font-size: 12px; }
    .search { width: 220px; height: 38px; border-radius: 10px; padding: 0 12px; }
    .search[hidden] { display: none !important; }
    .search-toggle { display: grid; place-items: center; width: 40px; height: 38px; flex: 0 0 auto; border: 1px solid var(--line); border-radius: 10px; background: var(--control-bg); color: var(--soft-ink); }
    .search-toggle:hover, .search-toggle[aria-expanded="true"] { background: var(--green-pale); color: var(--green-dark); border-color: var(--line); }
    .search-toggle svg { width: 18px; height: 18px; }
    .filters { display: flex; gap: 7px; overflow-x: auto; padding: 0 0 13px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter { flex: 0 0 auto; border: 1px solid var(--line); color: var(--muted); background: transparent; border-radius: 999px; padding: 7px 12px; font-size: 12px; }
    .filter:hover { border-color: #a9b8ad; }
    .filter.active { color: var(--green-dark); background: var(--green-pale); border-color: var(--line); font-weight: 700; }
    .items { display: grid; gap: 9px; }
    .item { display: grid; grid-template-columns: minmax(0, 1fr) 130px 112px 132px; align-items: center; gap: 16px; padding: 15px 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 15px; box-shadow: 0 5px 18px rgba(41,48,42,.025); touch-action: pan-y; transition: transform .18s ease, opacity .18s ease, background .18s ease; }
    .item-main { min-width: 0; }
    .item-top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .subject { display: inline-flex; padding: 4px 8px; border-radius: 6px; background: var(--soft-surface); color: var(--soft-ink); font-size: 10px; font-weight: 700; }
    .topic-with-image { display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; }
    .topic { min-width: 0; font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
    .topic-image-button, .topic-image-link { display: grid; place-items: center; flex: 0 0 40px; width: 40px; height: 40px; overflow: hidden; border: 1px solid var(--line); border-radius: 9px; background: var(--control-bg); color: var(--muted); }
    .topic-image-button { position: relative; padding: 0; }
    .topic-image-button:hover { border-color: var(--green); color: var(--green); background: var(--green-pale); }
    .topic-image-button svg { width: 18px; height: 18px; }
    .topic-image-button:not(:disabled)::after { content: "+"; position: absolute; right: 2px; bottom: 1px; display: grid; place-items: center; width: 13px; height: 13px; border-radius: 50%; background: var(--paper); color: var(--green); font-size: 11px; font-weight: 800; line-height: 1; }
    .topic-image-link img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .topic-visual { position: relative; flex: 0 0 40px; width: 40px; height: 40px; }
    .topic-image-refresh { position: absolute; right: -5px; bottom: -5px; display: grid; place-items: center; width: 19px; height: 19px; padding: 0; border: 1px solid var(--paper); border-radius: 50%; background: var(--green); color: #fff; font-size: 13px; line-height: 1; }
    .topic-image-refresh:disabled { opacity: .6; }
    .image-spinner { display: block; width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--green); border-radius: 50%; animation: image-spin .7s linear infinite; }
    .topic-image-refresh .image-spinner { width: 11px; height: 11px; border-width: 1.5px; border-color: rgba(255,255,255,.45); border-top-color: #fff; }
    @keyframes image-spin { to { transform: rotate(360deg); } }
    .priority-select { width: auto; min-width: 54px; max-width: 76px; height: 27px; padding: 0 6px 0 8px; border-radius: 7px; font-size: 10px; }
    .priority-select[data-priority="low"] { color: var(--low-text); background-color: var(--low-bg); border-color: var(--low-border); }
    .priority-select[data-priority="medium"] { color: var(--medium-text); background-color: var(--medium-bg); border-color: var(--medium-border); }
    .priority-select[data-priority="high"] { color: var(--high-text); background-color: var(--high-bg); border-color: var(--high-border); font-weight: 750; }
    .drag-handle { display: none; position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 26px; height: 40px; padding: 0; border: 0; background: transparent; color: #89928c; font-size: 20px; cursor: grab; touch-action: none; user-select: none; }
    .item.custom-sort { padding-left: 40px; }
    .item.custom-sort .drag-handle { display: block; }
    .item.dragging { opacity: .6; outline: 2px solid #a8c4b1; }
    .item.swipe-out { transform: translateX(-70px); opacity: .15; background: var(--high-bg); }
    .review-meter { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
    .meter-label { color: var(--muted); font-size: 10px; }
    .lamps { display: flex; align-items: center; gap: 6px; min-height: 22px; }
    .lamp { display: block; width: 15px; height: 15px; border: 0; border-radius: 50%; background: var(--inactive-lamp); }
    .lamp.on { background: #e3aa43; }
    .review-count { color: var(--ink); font-size: 21px; line-height: 1.1; font-weight: 800; letter-spacing: -.035em; }
    .review-count small { margin-left: 3px; font-size: 12px; font-weight: 650; letter-spacing: 0; }
    .meter-note { color: var(--green); font-size: 10px; font-weight: 700; }
    .elapsed { min-width: 92px; text-align: right; }
    .elapsed strong { display: block; font-size: 13px; font-weight: 700; }
    .elapsed span { display: block; color: var(--muted); font-size: 10px; margin-top: 3px; }
    .elapsed.never strong { color: var(--amber); }
    .elapsed.today strong { color: var(--green); }
    .review-actions { display: flex; align-items: center; justify-content: flex-end; gap: 5px; }
    .review-btn { min-width: 94px; min-height: 38px; padding: 0 12px; border-radius: 10px; font-size: 12px; }
    .review-decrease { display: grid; place-items: center; flex: 0 0 32px; width: 32px; height: 44px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--muted); opacity: .48; transition: background .15s, opacity .15s, transform .15s; }
    .review-decrease::before { content: ""; display: block; width: 12px; height: 2px; border-radius: 2px; background: currentColor; }
    .review-decrease:hover:not(:disabled) { background: var(--soft-surface); opacity: .9; }
    .review-decrease:active:not(:disabled) { transform: scale(.92); }
    .review-decrease:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; opacity: 1; }
    .review-decrease:disabled { cursor: default; opacity: .16; }
    .item[data-priority="low"] { background: var(--priority-low-surface); border-color: var(--priority-low-border); }
    .item[data-priority="medium"] { background: var(--priority-medium-surface); border-color: var(--priority-medium-border); }
    .item[data-priority="high"] { background: var(--priority-high-surface); border-color: var(--priority-high-border); }
    .delete-btn { display: none; position: absolute; top: 7px; right: 8px; border: 0; background: transparent; color: var(--high-text); font-size: 11px; line-height: 1; padding: 6px 8px; }
    .item { position: relative; }
    .item:hover .delete-btn, .delete-btn:focus-visible { display: block; }
    .confetti-layer { position: absolute; z-index: 4; inset: 0; overflow: hidden; border-radius: inherit; pointer-events: none; }
    .confetti-piece { position: absolute; left: var(--x); top: var(--y); width: var(--size); height: calc(var(--size) * .58); border-radius: 2px; background: var(--color); opacity: 0; animation: confetti-burst var(--duration) cubic-bezier(.15,.7,.25,1) var(--delay) forwards; }
    @keyframes confetti-burst {
      0% { opacity: 0; transform: translate(0, 0) rotate(0deg) scale(.5); }
      12% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--turn)) scale(1); }
    }
    .undo-banner { position: fixed; z-index: 10; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 18px; width: min(520px, calc(100% - 24px)); padding: 12px 14px; transform: translateX(-50%); border-radius: 14px; background: #26332e; color: #fff; box-shadow: 0 12px 32px rgba(24,34,29,.22); font-size: 13px; touch-action: none; user-select: none; }
    .undo-banner span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .undo-banner[hidden] { display: none; }
    .undo-button { flex: 0 0 auto; border: 0; border-radius: 8px; padding: 8px 10px; background: var(--green-pale); color: var(--green-dark); font-weight: 750; }
    .empty { display: none; padding: 46px 16px; text-align: center; border: 1px dashed var(--line); border-radius: 16px; color: var(--muted); }
    .empty strong { display: block; color: var(--ink); margin-bottom: 6px; font-size: 14px; }
    .empty.visible { display: block; }
    .toast { position: fixed; z-index: 12; left: 50%; top: calc(12px + env(safe-area-inset-top)); max-width: calc(100% - 28px); padding: 10px 14px; transform: translateX(-50%); border: 1px solid var(--line); border-radius: 11px; background: var(--paper); color: var(--ink); box-shadow: var(--shadow); font-size: 12px; }
    .toast[hidden] { display: none; }
    .transfer-dialog { width: min(360px, calc(100% - 32px)); margin: auto; padding: 20px; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); color: var(--ink); box-shadow: var(--shadow); }
    .transfer-dialog::backdrop { background: rgba(13, 20, 16, .42); backdrop-filter: blur(3px); }
    .transfer-dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
    .transfer-dialog h2 { margin: 0; font-size: 17px; }
    .transfer-dialog p { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .transfer-actions { display: grid; gap: 9px; margin-top: 17px; }
    .transfer-action { min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--control-bg); color: var(--ink); text-align: left; }
    .transfer-action.primary { border-color: var(--green); background: var(--green); color: #fff; font-weight: 700; }
    .transfer-close { flex: 0 0 auto; width: 32px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 9px; background: var(--control-bg); color: var(--soft-ink); font-size: 20px; line-height: 1; }
    footer { margin-top: 20px; text-align: right; color: var(--muted); font-size: 10px; }
    @media (max-width: 650px) {
      .shell { width: min(100% - 24px, 560px); padding: calc(22px + env(safe-area-inset-top)) 0 calc(42px + env(safe-area-inset-bottom)); }
      header { display: flex; align-items: flex-start; margin-bottom: 8px; }
      .header-brand { padding-top: max(0px, calc(38px - env(safe-area-inset-top))); }
      .header-actions { margin-top: max(0px, calc(38px - env(safe-area-inset-top))); }
      .eyebrow { margin-bottom: 5px; }
      .local-note { display: inline-block; margin-top: 13px; }
      .subject-progress { margin-bottom: 16px; }
      .progress-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
      .progress-card { padding: 8px 9px; border-radius: 11px; }
      .progress-heading { align-items: baseline; flex-direction: row; gap: 4px; margin-bottom: 7px; }
      .progress-heading h2 { font-size: 14px; }
      .progress-heading p, .progress-foot { display: none; }
      .progress-top { display: block; }
      .progress-subject { font-size: 10px; line-height: 1.35; }
      .progress-left { margin-top: 3px; font-size: 10px; }
      .progress-track { height: 5px; margin-top: 6px; }
      .composer { padding: 14px; }
      .composer-top { align-items: flex-start; flex-direction: column; gap: 8px; }
      select { max-width: none; width: 100%; height: 46px; }
      .input-row { gap: 7px; }
      .add-btn { padding: 0 14px; }
      .list-head { align-items: stretch; flex-direction: column; gap: 10px; }
      .list-tools { display: grid; grid-template-columns: minmax(0, 1fr) 44px; grid-template-rows: auto auto; gap: 8px; }
      .list-tools select { grid-column: 1; grid-row: 1; width: 100%; height: 44px; }
      .search-toggle { grid-column: 2; grid-row: 1; width: 44px; height: 44px; }
      .search { grid-column: 1 / -1; grid-row: 2; width: 100%; height: 44px; }
      .filter { padding: 9px 13px; }
      .item { grid-template-columns: minmax(0,1fr) auto; gap: 9px 10px; padding: 13px 12px; }
      .item-main { grid-column: 1 / 3; padding-right: 22px; }
      .review-meter { grid-column: 1; grid-row: 2; }
      .elapsed { grid-column: 1; grid-row: 3; }
      .review-actions { grid-column: 2; grid-row: 2 / 4; justify-self: end; }
      .elapsed { text-align: left; min-width: 0; }
      .elapsed strong, .elapsed span { display: inline; }
      .elapsed span { margin-left: 5px; }
      .review-btn { min-height: 44px; }
      .delete-btn { display: none !important; }
      .drag-handle { left: 6px; width: 26px; }
      .item.custom-sort { padding-left: 34px; }
      .priority-option { min-width: 54px; height: 40px; }
      .undo-banner { bottom: calc(10px + env(safe-area-inset-bottom)); }
    }
    @media (max-width: 360px) {
      header { align-items: center; gap: 10px; }
      h1 { font-size: 26px; }
      .header-actions { gap: 4px; }
      .header-icon { width: 34px; height: 34px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .confetti-piece { animation-duration: 1ms; }
      .image-spinner { animation-duration: 1ms; }
      .item { transition: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="header-brand">
        <p class="eyebrow">EXAM REVIEW</p>

  <script>
    (() => {
      const subjects = ['公共・倫理', '歴史総合・日本史探究', '生物基礎', '化学基礎'];
      const key = 'exam-review-stock-v1';
      const themeKey = 'review-stock-theme-mode-v1';
      const soundKey = 'review-stock-sound-v1';
      const IMAGE_SEARCH_VERSION = 3;
      const $ = (id) => document.getElementById(id);
      const systemTheme = matchMedia('(prefers-color-scheme: dark)');
      let themeMode = 'auto';
      let soundEnabled = true;
      try {
        const savedTheme = localStorage.getItem(themeKey);
        if (savedTheme === 'light' || savedTheme === 'dark') themeMode = savedTheme;
        soundEnabled = localStorage.getItem(soundKey) !== 'off';
      } catch {}
      let audioContext = null;
      let toastTimer = null;
      let imageQueueRunning = false;
      let automaticImageErrorNotified = false;
      const imageQueue = [];
      const queuedImageIds = new Set();
      const imageRequests = new Map();
      let activeSubject = 'すべて';
      let activeSort = 'elapsed';
      let selectedPriority = 'medium';
      let undoStack = [];
      let undoTimer = null;
      let undoSwipeStart = null;
      let swipeStart = null;
      let draggingItem = null;
      let dragPointerId = null;
      let entries = load();

      function isHttpsUrl(value) {
        try { return new URL(value).protocol === 'https:'; }
        catch { return false; }
      }
      function normalizeStoredImage(image, topic) {
        if (!image || typeof image !== 'object') return null;
        const url = String(image.url || '');
        const article = String(image.article || '');
        const title = String(image.title || topic).slice(0, 140);
        if (image.source === 'openverse'
          && /^https:\/\/api\.openverse\.org\/v1\/images\/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\/thumb\/(?:\?.*)?$/i.test(url)
          && isHttpsUrl(article)) {
          return {
            url, article, title, source: 'openverse',
            creator: String(image.creator || '').slice(0, 100),
            license: String(image.license || '').slice(0, 40),
            licenseUrl: isHttpsUrl(image.licenseUrl) ? String(image.licenseUrl).slice(0, 250) : ''
          };
        }
        if (/^https:\/\/(?:upload|thumb)\.wikimedia\.org\//.test(url)
          && /^https:\/\/ja\.wikipedia\.org\/wiki\//.test(article)) {
          return { url, article, title, source: 'wikipedia' };
        }
        return null;
      }
      function load() {
        try {
          const saved = JSON.parse(localStorage.getItem(key) || '[]');
          return Array.isArray(saved) ? saved.filter(x => x && typeof x.topic === 'string' && subjects.includes(x.subject)).map((x, index) => ({
            id: String(x.id || makeId()), subject: x.subject, topic: x.topic,
            reviews: Array.isArray(x.reviews) ? x.reviews.filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)) : [],
            priority: ['low', 'medium', 'high'].includes(x.priority) ? x.priority : 'medium',
            image: normalizeStoredImage(x.image, x.topic),
            imageLookupAt: Number.isFinite(Number(x.imageLookupAt)) && x.imageLookupAt != null ? Number(x.imageLookupAt) : 0,
            imageSearchVersion: Number.isFinite(Number(x.imageSearchVersion)) && x.imageSearchVersion != null ? Math.max(0, Math.floor(Number(x.imageSearchVersion))) : 0,
            createdAt: Number.isFinite(Number(x.createdAt)) && x.createdAt != null ? Number(x.createdAt) : Date.now() - (saved.length - index) * 1000,
            customOrder: Number.isFinite(Number(x.customOrder)) && x.customOrder != null ? Number(x.customOrder) : index
          })) : [];
        } catch { return []; }
      }
      function persist() {
        try { localStorage.setItem(key, JSON.stringify(entries)); }
        catch { alert('保存できませんでした。ブラウザの保存領域をご確認ください。'); }
      }
      function normalizeTransferEntry(item, index) {
        if (!item || typeof item !== 'object' || !subjects.includes(item.subject) || typeof item.topic !== 'string') return null;
        const topic = item.topic.trim();
        if (!topic || topic.length > 160) return null;
        const reviews = Array.isArray(item.reviews)
          ? item.reviews.filter(date => typeof date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(date)).slice(0, 500)
          : [];
        const createdAt = Number(item.createdAt);
        const imageLookupAt = Number(item.imageLookupAt);
        const imageSearchVersion = Number(item.imageSearchVersion);
        const customOrder = Number(item.customOrder);
        return {
          id: String(item.id || makeId()).slice(0, 120),
          subject: item.subject,
          topic,
          reviews,
          priority: ['low', 'medium', 'high'].includes(item.priority) ? item.priority : 'medium',
          image: normalizeStoredImage(item.image, topic),
          imageLookupAt: Number.isFinite(imageLookupAt) && item.imageLookupAt != null ? imageLookupAt : 0,
          imageSearchVersion: Number.isFinite(imageSearchVersion) && item.imageSearchVersion != null ? Math.min(IMAGE_SEARCH_VERSION, Math.max(0, Math.floor(imageSearchVersion))) : 0,
          createdAt: Number.isFinite(createdAt) && createdAt > 0 ? createdAt : Date.now() + index,
          customOrder: Number.isFinite(customOrder) && customOrder >= 0 ? customOrder : index
        };
      }
      function mergeReviewHistory(current, imported) {
        const counts = new Map();
        [current, imported].forEach(history => {
          const localCounts = new Map();
          history.forEach(date => localCounts.set(date, (localCounts.get(date) || 0) + 1));
          localCounts.forEach((count, date) => counts.set(date, Math.max(counts.get(date) || 0, count)));
        });
        return [...counts.entries()].sort(([a], [b]) => a.localeCompare(b)).flatMap(([date, count]) => Array(count).fill(date));
      }
      function mergeImportedEntries(data) {
        if (!data || data.format !== 'exam-review-stock-transfer' || data.version !== 1 || !Array.isArray(data.entries) || data.entries.length > 2000) {
          throw new Error('Invalid review list file');
        }
        const imported = data.entries.map(normalizeTransferEntry).filter(Boolean);
        const byTask = new Map(entries.map(item => [`${item.subject}\u0000${item.topic.normalize('NFKC').replace(/\s+/g, ' ').toLocaleLowerCase('ja')}`, item]));
        const usedIds = new Set(entries.map(item => item.id));
        let nextOrder = entries.length ? Math.max(...entries.map(item => item.customOrder)) + 1 : 0;
        let added = 0;
        let merged = 0;
        imported.forEach(item => {
          const taskKey = `${item.subject}\u0000${item.topic.normalize('NFKC').replace(/\s+/g, ' ').toLocaleLowerCase('ja')}`;
          const current = byTask.get(taskKey);
          if (current) {
            current.reviews = mergeReviewHistory(current.reviews, item.reviews);
            const rank = { low: 0, medium: 1, high: 2 };
            if (rank[item.priority] > rank[current.priority]) current.priority = item.priority;
            if (!current.image && item.image) current.image = item.image;
            if (!current.imageLookupAt && item.imageLookupAt) current.imageLookupAt = item.imageLookupAt;
            current.imageSearchVersion = Math.min(Number(current.imageSearchVersion) || 0, item.imageSearchVersion);
            merged++;
            return;
          }
          while (!item.id || usedIds.has(item.id)) item.id = makeId();
          item.customOrder = nextOrder++;
          usedIds.add(item.id);
          entries.push(item);
          byTask.set(taskKey, item);
          added++;
        });
        return { added, merged, skipped: data.entries.length - imported.length };
      }
      function exportListData() {
        const payload = {
          format: 'exam-review-stock-transfer',
          version: 1,
          exportedAt: new Date().toISOString(),
          entries: entries.map(({ id, subject, topic, reviews, priority, image, imageLookupAt, imageSearchVersion, createdAt, customOrder }) => ({
            id, subject, topic, reviews, priority, image, imageLookupAt, imageSearchVersion, createdAt, customOrder
          }))
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const now = new Date();
        const date = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        link.href = url;
        link.download = `review-stock-${date}.json`;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
        $('transfer-dialog').close();
        showToast(`${entries.length}件を書き出したよ`);
      }
      function makeId() { return (crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`; }
      function effectiveTheme() { return themeMode === 'auto' ? (systemTheme.matches ? 'dark' : 'light') : themeMode; }
      function applyTheme() {
        const dark = effectiveTheme() === 'dark';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        $('theme-icon-sun').hidden = !dark;
        $('theme-icon-moon').hidden = dark;
        $('theme-toggle').setAttribute('aria-label', dark ? 'ライトモードに切り替え' : 'ダークモードに切り替え');
        $('theme-toggle').title = `テーマ: ${themeMode === 'auto' ? '端末に合わせる' : dark ? 'ダーク' : 'ライト'}`;
        document.querySelector('meta[name="theme-color"]').content = dark ? '#111815' : '#235f4c';
      }
      function setSoundButton() {
        $('sound-icon-on').hidden = !soundEnabled;
        $('sound-icon-off').hidden = soundEnabled;
        $('sound-toggle').setAttribute('aria-label', soundEnabled ? '効果音をオフにする' : '効果音をオンにする');
        $('sound-toggle').title = soundEnabled ? '効果音オン' : '効果音オフ';
      }
      function withAudio(play) {
        if (!soundEnabled) return;
        try {
          const Audio = window.AudioContext || window.webkitAudioContext;
          if (!Audio) return;
          if (!audioContext || audioContext.state === 'closed') audioContext = new Audio();
          const context = audioContext;
          const start = () => { if (soundEnabled && context.state !== 'closed') play(context); };
          if (context.state === 'suspended') context.resume().then(start).catch(() => {});
          else start();
        } catch {}
      }
      function playTone(context, frequency, offset, duration, volume, type = 'triangle') {
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        const start = context.currentTime + offset;
        const attack = Math.min(0.014, duration * 0.35);
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + attack);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        oscillator.connect(gain);
        gain.connect(context.destination);
        oscillator.start(start);
        oscillator.stop(start + duration + 0.01);
      }
      function playTap() {
        withAudio(context => {
          const oscillator = context.createOscillator();
          const gain = context.createGain();
          const start = context.currentTime;
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(1880, start);
          oscillator.frequency.exponentialRampToValueAtTime(1120, start + 0.045);
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(0.032, start + 0.004);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.052);
          oscillator.connect(gain);
          gain.connect(context.destination);
          oscillator.start(start);
          oscillator.stop(start + 0.06);
          playTone(context, 2380, 0.001, 0.026, 0.004, 'sine');
        });
      }
      function playSlide() {
        withAudio(context => {
          const length = Math.max(1, Math.floor(context.sampleRate * 0.09));
          const buffer = context.createBuffer(1, length, context.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / length);
          const source = context.createBufferSource();
          const filter = context.createBiquadFilter();
          const gain = context.createGain();
          const start = context.currentTime;
          source.buffer = buffer;
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(900, start);
          filter.frequency.exponentialRampToValueAtTime(430, start + 0.085);
          filter.Q.setValueAtTime(0.5, start);
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(0.026, start + 0.016);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.09);
          source.connect(filter);
          filter.connect(gain);
          gain.connect(context.destination);
          source.start(start);
          source.stop(start + 0.095);
        });
      }
      function playFanfare() {
        withAudio(context => [523.25, 659.25, 783.99].forEach((frequency, index) => {
          playTone(context, frequency, index * 0.09, 0.17, 0.011, 'triangle');
          playTone(context, frequency * 2, index * 0.09, 0.13, 0.0015, 'sine');
        }));
      }
      function showToast(message) {
        $('toast').textContent = message;
        $('toast').hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { $('toast').hidden = true; }, 2600);
      }
      function imageSearchQuery(topic) {
        const original = String(topic || '').normalize('NFKC').trim().replace(/\s+/g, ' ');
        const simplified = original.replace(/(?:の)?(?:順序|流れ|内容|特徴|原因|結果|覚え方|ポイント|まとめ|について|とは)$/u, '').trim();
        return simplified.length >= 2 ? simplified : original;
      }
      function compactImageText(value) {
        return String(value || '').normalize('NFKC').toLocaleLowerCase('ja').replace(/[\s\p{P}\p{S}]+/gu, '');
      }
      function imageTextScore(query, candidate) {
        const wanted = compactImageText(query);
        const text = compactImageText(candidate);
        if (!wanted || !text) return 0;
        if (wanted === text || text.includes(wanted)) return 1;
        const wantedChars = Array.from(wanted);
        const textChars = Array.from(text);
        if (wanted.includes(text) && textChars.length >= Math.min(4, wantedChars.length)) {
          return 0.62 + 0.28 * (textChars.length / wantedChars.length);
        }
        const bigrams = chars => chars.length === 1 ? [chars[0]] : chars.slice(0, -1).map((char, index) => char + chars[index + 1]);
        const wantedGrams = new Set(bigrams(wantedChars));
        const textGrams = new Set(bigrams(textChars));
        let overlap = 0;
        wantedGrams.forEach(gram => { if (textGrams.has(gram)) overlap++; });
        return 2 * overlap / Math.max(1, wantedGrams.size + textGrams.size);
      }
      async function findWikipediaMatch(topic) {
        const query = imageSearchQuery(topic);
        const params = new URLSearchParams({
          action: 'query', generator: 'search', gsrsearch: query, gsrnamespace: '0', gsrlimit: '10',
          prop: 'pageimages|pageprops', piprop: 'thumbnail|name', pithumbsize: '180',
          format: 'json', origin: '*'
        });
        const response = await fetch(`https://ja.wikipedia.org/w/api.php?${params}`, { credentials: 'omit', referrerPolicy: 'no-referrer' });
        if (!response.ok) throw new Error('Wikipedia image lookup failed');
        const data = await response.json();
        if (data.error) throw new Error(data.error.info || 'Wikipedia image lookup failed');
        const pages = Object.values(data.query?.pages || {}).map(page => ({
          page,
          titleScore: imageTextScore(query, page.title),
          fileScore: imageTextScore(query, page.pageimage)
        })).filter(result => result.titleScore >= 0.76)
          .sort((a, b) => (b.titleScore + b.fileScore * 0.24) - (a.titleScore + a.fileScore * 0.24) || (a.page.index ?? 0) - (b.page.index ?? 0));
        for (const { page } of pages) {
          const url = page.thumbnail?.source;
          if (!url || !/^https:\/\/(?:upload|thumb)\.wikimedia\.org\//.test(url)) continue;
          const title = String(page.title || query).slice(0, 140);
          return {
            wikidataId: pages[0]?.page.pageprops?.wikibase_item || '',
            image: {
              url,
              title,
              article: `https://ja.wikipedia.org/wiki/${encodeURIComponent(String(page.title || query).replaceAll(' ', '_'))}`,
              source: 'wikipedia'
            }
          };
        }
        return { wikidataId: pages[0]?.page.pageprops?.wikibase_item || '', image: null };
      }
      async function findEnglishWikidataLabel(id) {
        if (!/^Q\d+$/.test(String(id || ''))) return '';
        const params = new URLSearchParams({ action: 'wbgetentities', ids: id, props: 'labels', languages: 'en', format: 'json', origin: '*' });
        const response = await fetch(`https://www.wikidata.org/w/api.php?${params}`, { credentials: 'omit', referrerPolicy: 'no-referrer' });
        if (!response.ok) throw new Error('Wikidata lookup failed');
        const data = await response.json();
        if (data.error) throw new Error(data.error.info || 'Wikidata lookup failed');
        return String(data.entities?.[id]?.labels?.en?.value || '').trim();
      }
      async function findOpenverseImage(topic) {
        const query = imageSearchQuery(topic);
        const params = new URLSearchParams({ q: query, page_size: '20', mature: 'false' });
        const response = await fetch(`https://api.openverse.org/v1/images/?${params}`, { credentials: 'omit', referrerPolicy: 'no-referrer' });
        if (!response.ok) throw new Error('Openverse image lookup failed');
        const data = await response.json();
        if (data.error) throw new Error(data.error.detail || 'Openverse image lookup failed');
        const uuidPattern = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
        const candidates = (data.results || []).map(result => {

          render();
          queueMissingImages();
          transferDialog.close();
          showToast(`新規${result.added}件・統合${result.merged}件を取り込んだよ`);
        } catch {
          showToast('復習ストックの書き出しファイルを選んでね');
        } finally { transferFile.value = ''; }
      });
      document.addEventListener('pointerdown', event => {
        if (event.target.closest('select')) playSlide();
      }, true);
      document.addEventListener('click', event => {
        if (event.target.closest('button, input, a')) playTap();
      });
      window.addEventListener('online', () => {
        entries.forEach(item => { if (!item.image) item.imageLookupAt = 0; });
        persist();
        queueMissingImages();
      });
      applyTheme();
      setSoundButton();
      attachListGestures();
      render();
      queueMissingImages();
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
    }
  </script>
</body>
</html>
