<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#235f4c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="復習ストック">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <title>復習ストック</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #232c2b;
      --muted: #79817d;
      --line: #e8e7df;
      --paper: #fffefa;
      --canvas: #f7f6f2;
      --green: #235f4c;
      --green-dark: #174b3b;
      --green-pale: #e8f0e9;
      --amber: #a56624;
      --amber-pale: #fff1db;
      --shadow: 0 14px 36px rgba(41, 48, 42, .055);
      font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(1060px, calc(100% - 40px)); margin: 0 auto; padding: 48px 0 72px; }
    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 28px; }
    .eyebrow { color: var(--green); font-size: 12px; font-weight: 800; letter-spacing: .12em; margin: 0 0 9px; }
    h1 { font-size: clamp(29px, 4vw, 38px); line-height: 1.2; letter-spacing: -.04em; margin: 0; }
    .subtitle { color: var(--muted); margin: 10px 0 0; font-size: 14px; }
    .local-note { flex: 0 0 auto; color: var(--muted); font-size: 12px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,254,250,.7); }
    .subject-progress { margin-bottom: 25px; }
    .progress-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 11px; }
    .progress-heading h2 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
    .progress-heading p { margin: 0; color: var(--muted); font-size: 11px; }
    .progress-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .progress-card { min-width: 0; padding: 14px 15px; background: var(--paper); border: 1px solid var(--line); border-radius: 15px; box-shadow: var(--shadow); }
    .progress-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .progress-subject { font-size: 12px; line-height: 1.5; font-weight: 750; }
    .progress-left { flex: 0 0 auto; color: var(--green); font-size: 12px; font-weight: 750; white-space: nowrap; }
    .progress-left.done { color: #68736d; }
    .progress-track { height: 7px; margin-top: 10px; overflow: hidden; border-radius: 999px; background: #eeeee8; }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #75a98a, #347455); transition: width .2s ease; }
    .progress-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 7px; color: var(--muted); font-size: 10px; }
    .composer { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 19px; box-shadow: var(--shadow); margin-bottom: 25px; }
    .composer-top { display: flex; align-items: center; gap: 12px; }
    .composer-title { font-size: 14px; font-weight: 750; white-space: nowrap; }
    select, .search { background: #fff; color: var(--ink); border: 1px solid #dcded6; outline: 0; }
    select { height: 42px; border-radius: 11px; padding: 0 34px 0 12px; max-width: 290px; }
    select:focus, .search:focus, .topic-input:focus { border-color: #6b9b83; box-shadow: 0 0 0 3px rgba(35,95,76,.1); }
    .input-row { display: flex; gap: 9px; margin-top: 13px; }
    .topic-input { flex: 1; min-width: 0; height: 48px; padding: 0 14px; border: 1px solid #dcded6; border-radius: 12px; outline: 0; background: #fff; }
    .topic-input::placeholder { color: #a3a9a3; }
    .add-btn, .review-btn { border: 0; background: var(--green); color: #fff; font-weight: 700; border-radius: 12px; transition: background .15s, transform .15s; }
    .add-btn { padding: 0 19px; height: 48px; white-space: nowrap; }
    .add-btn:hover, .review-btn:hover { background: var(--green-dark); }
    .add-btn:active, .review-btn:active { transform: scale(.98); }
    .hint { color: var(--muted); font-size: 11px; margin: 9px 0 0 2px; }
    .priority-picker { display: flex; align-items: center; gap: 7px; margin-top: 12px; }
    .priority-label { margin-right: 2px; color: var(--muted); font-size: 11px; }
    .priority-option { height: 34px; min-width: 48px; padding: 0 11px; border: 1px solid var(--line); border-radius: 999px; color: #69716c; background: #fff; font-size: 12px; }
    .priority-option:hover { border-color: #b9c1b8; }
    .priority-option.active[data-priority-choice="low"] { color: #27697d; background: #eaf3f5; border-color: #c8e0e5; font-weight: 750; }
    .priority-option.active[data-priority-choice="medium"] { color: #93651d; background: #fff3dc; border-color: #f0dbb4; font-weight: 750; }
    .priority-option.active[data-priority-choice="high"] { color: #9a463e; background: #faece9; border-color: #edc8c2; font-weight: 750; }
    .list-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 13px; }
    .list-title { margin: 0; font-size: 19px; letter-spacing: -.025em; }
    .list-caption { color: var(--muted); font-size: 12px; margin: 5px 0 0; }
    .list-tools { display: flex; gap: 8px; }
    .list-tools select { width: 180px; height: 38px; border-radius: 10px; font-size: 12px; }
    .search { width: 220px; height: 38px; border-radius: 10px; padding: 0 12px; }
    .search[hidden] { display: none !important; }
    .search-toggle { display: grid; place-items: center; width: 40px; height: 38px; flex: 0 0 auto; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: #59635e; }
    .search-toggle:hover, .search-toggle[aria-expanded="true"] { background: var(--green-pale); color: var(--green-dark); border-color: #d2e1d5; }
    .search-toggle svg { width: 18px; height: 18px; }
    .filters { display: flex; gap: 7px; overflow-x: auto; padding: 0 0 13px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter { flex: 0 0 auto; border: 1px solid var(--line); color: #67706c; background: transparent; border-radius: 999px; padding: 7px 12px; font-size: 12px; }
    .filter:hover { border-color: #a9b8ad; }
    .filter.active { color: var(--green-dark); background: var(--green-pale); border-color: #d2e1d5; font-weight: 700; }
    .items { display: grid; gap: 9px; }
    .item { display: grid; grid-template-columns: minmax(0, 1fr) 130px 112px 94px; align-items: center; gap: 16px; padding: 15px 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 15px; box-shadow: 0 5px 18px rgba(41,48,42,.025); touch-action: pan-y; transition: transform .18s ease, opacity .18s ease, background .18s ease; }
    .item-main { min-width: 0; }
    .item-top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .subject { display: inline-flex; padding: 4px 8px; border-radius: 6px; background: #f0f1ed; color: #59635e; font-size: 10px; font-weight: 700; }
    .topic { font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
    .priority-select { width: auto; min-width: 54px; max-width: 76px; height: 27px; padding: 0 6px 0 8px; border-radius: 7px; font-size: 10px; }
    .priority-select[data-priority="low"] { color: #27697d; background-color: #eaf3f5; border-color: #c8e0e5; }
    .priority-select[data-priority="medium"] { color: #93651d; background-color: #fff3dc; border-color: #f0dbb4; }
    .priority-select[data-priority="high"] { color: #9a463e; background-color: #faece9; border-color: #edc8c2; font-weight: 750; }
    .drag-handle { display: none; position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 26px; height: 40px; padding: 0; border: 0; background: transparent; color: #89928c; font-size: 20px; cursor: grab; touch-action: none; user-select: none; }
    .item.custom-sort { padding-left: 40px; }
    .item.custom-sort .drag-handle { display: block; }
    .item.dragging { opacity: .6; outline: 2px solid #a8c4b1; }
    .item.swipe-out { transform: translateX(-70px); opacity: .15; background: #faece9; }
    .review-meter { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
    .meter-label { color: var(--muted); font-size: 10px; }
    .lamps { display: flex; align-items: center; gap: 6px; min-height: 22px; }
    .lamp { display: block; width: 15px; height: 15px; border: 0; border-radius: 50%; background: #e6e8e2; }
    .lamp.on { background: #e3aa43; }
    .review-count { color: var(--ink); font-size: 21px; line-height: 1.1; font-weight: 800; letter-spacing: -.035em; }
    .review-count small { margin-left: 3px; font-size: 12px; font-weight: 650; letter-spacing: 0; }
    .meter-note { color: var(--green); font-size: 10px; font-weight: 700; }
    .elapsed { min-width: 92px; text-align: right; }
    .elapsed strong { display: block; font-size: 13px; font-weight: 700; }
    .elapsed span { display: block; color: var(--muted); font-size: 10px; margin-top: 3px; }
    .elapsed.never strong { color: var(--amber); }
    .elapsed.today strong { color: var(--green); }
    .review-btn { min-width: 94px; min-height: 38px; padding: 0 12px; border-radius: 10px; font-size: 12px; }
    .delete-btn { display: none; position: absolute; top: 7px; right: 8px; border: 0; background: transparent; color: #9a5a53; font-size: 11px; line-height: 1; padding: 6px 8px; }
    .item { position: relative; }
    .item:hover .delete-btn, .delete-btn:focus-visible { display: block; }
    .confetti-layer { position: absolute; z-index: 4; inset: 0; overflow: hidden; pointer-events: none; }
    .confetti-piece { position: absolute; left: var(--x); top: var(--y); width: var(--size); height: calc(var(--size) * .58); border-radius: 2px; background: var(--color); opacity: 0; animation: confetti-burst var(--duration) cubic-bezier(.15,.7,.25,1) var(--delay) forwards; }
    @keyframes confetti-burst {
      0% { opacity: 0; transform: translate(0, 0) rotate(0deg) scale(.5); }
      12% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--turn)) scale(1); }
    }
    .undo-banner { position: fixed; z-index: 10; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 18px; width: min(520px, calc(100% - 24px)); padding: 12px 14px; transform: translateX(-50%); border-radius: 14px; background: #26332e; color: #fff; box-shadow: 0 12px 32px rgba(24,34,29,.22); font-size: 13px; touch-action: none; user-select: none; }
    .undo-banner span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .undo-banner[hidden] { display: none; }
    .undo-button { flex: 0 0 auto; border: 0; border-radius: 8px; padding: 8px 10px; background: #e6f0e8; color: #235f4c; font-weight: 750; }
    .empty { display: none; padding: 46px 16px; text-align: center; border: 1px dashed #d8dad3; border-radius: 16px; color: var(--muted); }
    .empty strong { display: block; color: var(--ink); margin-bottom: 6px; font-size: 14px; }
    .empty.visible { display: block; }
    footer { margin-top: 20px; text-align: right; color: #969c96; font-size: 10px; }
    @media (max-width: 650px) {
      .shell { width: min(100% - 24px, 560px); padding: calc(22px + env(safe-area-inset-top)) 0 calc(42px + env(safe-area-inset-bottom)); }
      header { display: block; margin-bottom: 20px; }
      .local-note { display: inline-block; margin-top: 13px; }
      .subject-progress { margin-bottom: 16px; }
      .progress-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
      .progress-card { padding: 8px 9px; border-radius: 11px; }
      .progress-heading { align-items: baseline; flex-direction: row; gap: 4px; margin-bottom: 7px; }
      .progress-heading h2 { font-size: 14px; }
      .progress-heading p, .progress-foot { display: none; }
      .progress-top { display: block; }
      .progress-subject { font-size: 10px; line-height: 1.35; }
      .progress-left { margin-top: 3px; font-size: 10px; }
      .progress-track { height: 5px; margin-top: 6px; }
      .composer { padding: 14px; }
      .composer-top { align-items: flex-start; flex-direction: column; gap: 8px; }
      select { max-width: none; width: 100%; height: 46px; }
      .input-row { gap: 7px; }
      .add-btn { padding: 0 14px; }
      .list-head { align-items: stretch; flex-direction: column; gap: 10px; }
      .list-tools { display: grid; grid-template-columns: minmax(0, 1fr) 44px; grid-template-rows: auto auto; gap: 8px; }
      .list-tools select { grid-column: 1; grid-row: 1; width: 100%; height: 44px; }
      .search-toggle { grid-column: 2; grid-row: 1; width: 44px; height: 44px; }
      .search { grid-column: 1 / -1; grid-row: 2; width: 100%; height: 44px; }
      .filter { padding: 9px 13px; }
      .item { grid-template-columns: minmax(0,1fr) auto; gap: 9px 10px; padding: 13px 12px; }
      .item-main { grid-column: 1 / 3; padding-right: 22px; }
      .review-meter { grid-column: 1; grid-row: 2; }
      .elapsed { grid-column: 1; grid-row: 3; }
      .review-btn { grid-column: 2; grid-row: 2 / 4; }
      .elapsed { text-align: left; min-width: 0; }
      .elapsed strong, .elapsed span { display: inline; }
      .elapsed span { margin-left: 5px; }
      .review-btn { justify-self: end; min-height: 44px; }
      .delete-btn { display: none !important; }
      .drag-handle { left: 6px; width: 26px; }
      .item.custom-sort { padding-left: 34px; }
      .priority-option { min-width: 54px; height: 40px; }
      .undo-banner { bottom: calc(10px + env(safe-area-inset-bottom)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .confetti-piece { animation-duration: 1ms; }
      .item { transition: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">EXAM REVIEW</p>
        <h1>復習ストック</h1>
      </div>
    </header>

    <section class="subject-progress" aria-label="科目ごとの復習進捗">
      <div class="progress-heading"><h2>科目別の復習進捗</h2><p>1ポイントにつき3回が目安</p></div>
      <div id="subject-progress" class="progress-grid"></div>
    </section>

    <section class="composer" aria-label="復習項目を追加">
      <div class="composer-top">
        <div class="composer-title">苦手ポイントをさっと追加</div>
        <select id="subject-select" aria-label="科目">
          <option>公共・倫理</option>
          <option>歴史総合・日本史探究</option>
          <option>生物基礎</option>
          <option>化学基礎</option>
        </select>
      </div>
      <div class="priority-picker" role="group" aria-label="新しいポイントの優先度">
        <span class="priority-label">優先度</span>
        <button class="priority-option" type="button" data-priority-choice="low" aria-pressed="false">低</button>
        <button class="priority-option active" type="button" data-priority-choice="medium" aria-pressed="true">中</button>
        <button class="priority-option" type="button" data-priority-choice="high" aria-pressed="false">高</button>
      </div>
      <form id="add-form" class="input-row">
        <input id="topic-input" class="topic-input" type="text" maxlength="160" autocomplete="off" placeholder="例：条約改正の順序" aria-label="復習ポイント">
        <button class="add-btn" type="submit">＋ 追加</button>
      </form>
    </section>

    <section aria-label="復習項目一覧">
      <div class="list-head">
        <div><h2 class="list-title">復習リスト</h2></div>
        <div class="list-tools">
          <select id="sort-select" aria-label="リストの並び順">
            <option value="elapsed">日が空いた順</option>
            <option value="created">作成した順（古い順）</option>
            <option value="priority">優先度の高い順</option>
            <option value="custom">カスタム</option>
          </select>
          <button id="search-toggle" class="search-toggle" type="button" aria-label="検索を開く" aria-expanded="false" title="検索">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.3 4.3"></path></svg>
          </button>
          <input id="search-input" class="search" type="search" placeholder="項目を検索" aria-label="項目を検索" hidden>
        </div>
      </div>
      <nav id="filters" class="filters" aria-label="科目で絞り込み"></nav>
      <div id="items" class="items"></div>
      <div id="empty" class="empty"><strong>まだ項目がありません</strong>復習ポイントを追加しよう。</div>
    </section>
    <div id="undo-banner" class="undo-banner" role="status" aria-live="polite" hidden>
      <span id="undo-message">削除しました</span>
      <button id="undo-button" class="undo-button" type="button">元に戻す</button>
    </div>
  </main>
  <script>
    (() => {
      const subjects = ['公共・倫理', '歴史総合・日本史探究', '生物基礎', '化学基礎'];
      const key = 'exam-review-stock-v1';
      const $ = (id) => document.getElementById(id);
      let activeSubject = 'すべて';
      let activeSort = 'elapsed';
      let selectedPriority = 'medium';
      let undoStack = [];
      let undoTimer = null;
      let undoSwipeStart = null;
      let swipeStart = null;
      let draggingItem = null;
      let dragPointerId = null;
      let entries = load();

      function load() {
        try {
          const saved = JSON.parse(localStorage.getItem(key) || '[]');
          return Array.isArray(saved) ? saved.filter(x => x && typeof x.topic === 'string' && subjects.includes(x.subject)).map((x, index) => ({
            id: String(x.id || makeId()), subject: x.subject, topic: x.topic,
            reviews: Array.isArray(x.reviews) ? x.reviews.filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)) : [],
            priority: ['low', 'medium', 'high'].includes(x.priority) ? x.priority : 'medium',
            createdAt: Number.isFinite(Number(x.createdAt)) && x.createdAt != null ? Number(x.createdAt) : Date.now() - (saved.length - index) * 1000,
            customOrder: Number.isFinite(Number(x.customOrder)) && x.customOrder != null ? Number(x.customOrder) : index
          })) : [];
        } catch { return []; }
      }
      function persist() {
        try { localStorage.setItem(key, JSON.stringify(entries)); }
        catch { alert('保存できませんでした。ブラウザの保存領域をご確認ください。'); }
      }
      function makeId() { return (crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`; }
      function todayKey() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      }
      function daysAgo(date) {
        const [y,m,d] = date.split('-').map(Number);
        const then = new Date(y, m-1, d);
        const now = new Date(); now.setHours(0,0,0,0);
        return Math.max(0, Math.floor((now - then) / 86400000));
      }
      function escapeText(value) {
        return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      }
      function elapsedMarkup(reviews) {
        if (!reviews.length) return '<div class="elapsed never"><strong>未復習</strong><span>記録なし</span></div>';
        const last = reviews[reviews.length - 1];
        const days = daysAgo(last);
        const when = days === 0 ? '今日' : `${days}日前`;
        const date = last.replaceAll('-', '/');
        return `<div class="elapsed ${days === 0 ? 'today' : ''}"><strong>${when}</strong><span>${date}に復習</span></div>`;
      }
      function renderFilters() {
        const choices = ['すべて', ...subjects];
        $('filters').innerHTML = choices.map(s => `<button class="filter ${activeSubject === s ? 'active' : ''}" type="button" data-subject="${escapeText(s)}">${escapeText(s)}</button>`).join('');
        $('filters').querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
          activeSubject = btn.dataset.subject; render();
        }));
      }
      function priorityRank(priority) { return ({ low: 0, medium: 1, high: 2 })[priority] ?? 1; }
      function compareElapsed(a, b) {
        if (!a.reviews.length && b.reviews.length) return -1;
        if (a.reviews.length && !b.reviews.length) return 1;
        if (a.reviews.length && b.reviews.length) {
          const gap = daysAgo(b.reviews[b.reviews.length - 1]) - daysAgo(a.reviews[a.reviews.length - 1]);
          if (gap) return gap;
        }
        return a.createdAt - b.createdAt || a.topic.localeCompare(b.topic, 'ja');
      }
      function updateUndoBanner() {
        if (!undoStack.length) return;
        const last = undoStack[undoStack.length - 1].entry;
        $('undo-message').textContent = undoStack.length > 1 ? `${undoStack.length}件を削除しました` : `「${last.topic}」を削除しました`;
        $('undo-banner').hidden = false;
        clearTimeout(undoTimer);
        undoTimer = setTimeout(() => {
          undoStack = [];
          $('undo-banner').hidden = true;
        }, 7000);
      }
      function deleteEntry(id) {
        const index = entries.findIndex(e => e.id === id);
        if (index < 0) return;
        const [entry] = entries.splice(index, 1);
        undoStack.push({ entry, index });
        persist(); render(); updateUndoBanner();
      }
      function saveCustomOrder() {
        const list = $('items');
        const visibleIds = new Set([...list.querySelectorAll('.item')].map(card => card.dataset.itemId));
        const reorderedVisible = [...list.querySelectorAll('.item')].map(card => entries.find(e => e.id === card.dataset.itemId)).filter(Boolean);
        const orderedAll = entries.slice().sort((a,b) => a.customOrder - b.customOrder);
        const slots = [];
        orderedAll.forEach((entry, index) => { if (visibleIds.has(entry.id)) slots.push(index); });
        slots.forEach((slot, index) => { orderedAll[slot] = reorderedVisible[index]; });
        orderedAll.forEach((entry, index) => { entry.customOrder = index; });
        entries = orderedAll;
        persist();
      }
      function attachListGestures() {
        const list = $('items');
        list.addEventListener('pointerdown', event => {
          const handle = event.target.closest('.drag-handle');
          if (handle && activeSort === 'custom') {
            draggingItem = handle.closest('.item');
            dragPointerId = event.pointerId;
            draggingItem.classList.add('dragging');
            try { handle.setPointerCapture(event.pointerId); } catch {}
            event.preventDefault();
            return;
          }
          const card = event.target.closest('.item');
          if (event.pointerType === 'touch' && card && !event.target.closest('button, select, input')) {
            swipeStart = { id: card.dataset.itemId, pointerId: event.pointerId, x: event.clientX, y: event.clientY };
          }
        });
        list.addEventListener('pointermove', event => {
          if (!draggingItem || event.pointerId !== dragPointerId) return;
          const cards = [...list.querySelectorAll('.item')].filter(card => card !== draggingItem);
          const before = cards.find(card => event.clientY < card.getBoundingClientRect().top + card.getBoundingClientRect().height / 2);
          if (before) list.insertBefore(draggingItem, before);
          else list.appendChild(draggingItem);
        });
        list.addEventListener('pointerup', event => {
          if (draggingItem && event.pointerId === dragPointerId) {
            draggingItem.classList.remove('dragging');
            draggingItem = null; dragPointerId = null;
            saveCustomOrder(); render();
            return;
          }
          if (!swipeStart || event.pointerId !== swipeStart.pointerId) return;
          const gesture = swipeStart; swipeStart = null;
          const dx = event.clientX - gesture.x;
          const dy = event.clientY - gesture.y;
          const card = list.querySelector(`[data-item-id="${CSS.escape(gesture.id)}"]`);
          if (dx < -80 && Math.abs(dy) < 60 && card) {
            card.classList.add('swipe-out');
            setTimeout(() => deleteEntry(gesture.id), 180);
          }
        });
        list.addEventListener('pointercancel', event => {
          if (swipeStart?.pointerId === event.pointerId) swipeStart = null;
          if (draggingItem && event.pointerId === dragPointerId) {
            draggingItem.classList.remove('dragging');
            draggingItem = null; dragPointerId = null; render();
          }
        });
      }
      function celebrateItem(id) {
        const card = $('items').querySelector(`[data-item-id="${CSS.escape(id)}"]`);
        const layer = card?.querySelector('.confetti-layer');
        if (!layer) return;
        const colors = ['#e7ad47', '#65a88a', '#e27e6d', '#74a8d1', '#b78ad1'];
        for (let i = 0; i < 26; i++) {
          const piece = document.createElement('i');
          piece.className = 'confetti-piece';
          piece.style.setProperty('--x', `${42 + Math.random() * 48}%`);
          piece.style.setProperty('--y', `${25 + Math.random() * 55}%`);
          piece.style.setProperty('--size', `${5 + Math.random() * 4}px`);
          piece.style.setProperty('--color', colors[i % colors.length]);
          piece.style.setProperty('--dx', `${(Math.random() - .5) * 130}px`);
          piece.style.setProperty('--dy', `${-20 - Math.random() * 95}px`);
          piece.style.setProperty('--turn', `${Math.random() * 720 - 360}deg`);
          piece.style.setProperty('--duration', `${760 + Math.random() * 420}ms`);
          piece.style.setProperty('--delay', `${Math.random() * 90}ms`);
          layer.appendChild(piece);
        }
        setTimeout(() => layer.replaceChildren(), 1500);
      }
      function renderSubjectProgress() {
        $('subject-progress').innerHTML = subjects.map(subject => {
          const group = entries.filter(e => e.subject === subject);
          const target = group.length * 3;
          const completed = group.reduce((sum, e) => sum + Math.min(3, e.reviews.length), 0);
          const remaining = target - completed;
          const finishedTopics = group.filter(e => e.reviews.length >= 3).length;
          const percent = target ? Math.round(completed / target * 100) : 0;
          const status = !group.length ? '0ポイント' : remaining ? `あと${remaining}回` : '目安達成';
          const foot = !group.length ? 'ポイントを追加すると進捗が表示されます' : `目安達成 ${finishedTopics} / ${group.length}ポイント`;
          return `<article class="progress-card">
            <div class="progress-top"><div class="progress-subject">${escapeText(subject)}</div><div class="progress-left ${group.length && remaining === 0 ? 'done' : ''}">${status}</div></div>
            <div class="progress-track" role="progressbar" aria-label="${escapeText(subject)}の復習進捗" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent}"><div class="progress-fill" style="width:${percent}%"></div></div>
            <div class="progress-foot"><span>${foot}</span>${group.length ? `<span>${percent}%</span>` : ''}</div>
          </article>`;
        }).join('');
      }
      function render() {
        renderFilters();
        renderSubjectProgress();
        $('sort-select').value = activeSort;
        const query = $('search-input').value.trim().toLocaleLowerCase();
        const visible = entries.filter(e => (activeSubject === 'すべて' || e.subject === activeSubject) && (!query || `${e.topic} ${e.subject}`.toLocaleLowerCase().includes(query)))
          .sort((a,b) => {
            if (activeSort === 'created') return a.createdAt - b.createdAt || a.topic.localeCompare(b.topic, 'ja');
            if (activeSort === 'priority') return priorityRank(b.priority) - priorityRank(a.priority) || compareElapsed(a, b);
            if (activeSort === 'custom') return a.customOrder - b.customOrder || a.createdAt - b.createdAt;
            return compareElapsed(a, b);
          });
        $('items').innerHTML = visible.map(e => {
          const count = e.reviews.length;
          const lamps = [0,1,2].map(i => `<i class="lamp ${i < Math.min(3, count) ? 'on' : ''}"></i>`).join('');
          return `
          <article class="item ${activeSort === 'custom' ? 'custom-sort' : ''}" data-item-id="${escapeText(e.id)}">
            <div class="confetti-layer" aria-hidden="true"></div>
            <button type="button" class="drag-handle" aria-label="${escapeText(e.topic)}を並べ替え">⠿</button>
            <div class="item-main"><div class="item-top">
              <span class="subject">${escapeText(e.subject)}</span>
              <select class="priority-select" data-priority="${e.priority}" data-priority-id="${escapeText(e.id)}" aria-label="${escapeText(e.topic)}の優先度">
                <option value="low" ${e.priority === 'low' ? 'selected' : ''}>低</option>
                <option value="medium" ${e.priority === 'medium' ? 'selected' : ''}>中</option>
                <option value="high" ${e.priority === 'high' ? 'selected' : ''}>高</option>
              </select>
              <span class="topic">${escapeText(e.topic)}</span>
            </div></div>
            <div class="review-meter" aria-label="復習 ${count} 回">
              <span class="meter-label">復習回数</span>
              <div class="lamps" aria-hidden="true">${lamps}</div>
              <div class="review-count">${count <= 3 ? `${count}<small>/ 3回</small>` : `${count}<small>回</small>`}</div>
              ${count >= 3 ? '<span class="meter-note">目安クリア</span>' : ''}
            </div>
            ${elapsedMarkup(e.reviews)}
            <button type="button" class="review-btn" data-review="${escapeText(e.id)}">復習した</button>
            <button type="button" class="delete-btn" data-delete="${escapeText(e.id)}" aria-label="${escapeText(e.topic)}を削除" title="削除">削除</button>
          </article>`;
        }).join('');
        $('empty').classList.toggle('visible', visible.length === 0);
        $('empty').innerHTML = entries.length === 0
          ? '<strong>まだ項目がありません</strong>復習ポイントを追加しよう。'
          : '<strong>見つかりませんでした</strong>検索語や科目を変えてみてください。';
        $('items').querySelectorAll('[data-review]').forEach(btn => btn.addEventListener('click', () => {
          const item = entries.find(e => e.id === btn.dataset.review);
          if (!item) return;
          const reachesTarget = item.reviews.length === 2;
          item.reviews.push(todayKey()); persist(); render();
          if (reachesTarget) celebrateItem(item.id);
        }));
        $('items').querySelectorAll('[data-priority-id]').forEach(select => select.addEventListener('change', () => {
          const item = entries.find(e => e.id === select.dataset.priorityId);
          if (!item) return;
          item.priority = select.value; persist(); render();
        }));
        $('items').querySelectorAll('[data-delete]').forEach(btn => btn.addEventListener('click', () => {
          deleteEntry(btn.dataset.delete);
        }));
      }
      $('add-form').addEventListener('submit', event => {
        event.preventDefault();
        const input = $('topic-input');
        const topic = input.value.trim();
        if (!topic) { input.focus(); return; }
        const nextOrder = entries.length ? Math.max(...entries.map(e => e.customOrder)) + 1 : 0;
        entries.push({ id: makeId(), subject: $('subject-select').value, topic, reviews: [], priority: selectedPriority, createdAt: Date.now(), customOrder: nextOrder });
        persist(); input.value = ''; activeSubject = 'すべて'; render(); input.focus();
      });
      document.querySelectorAll('[data-priority-choice]').forEach(btn => btn.addEventListener('click', () => {
        selectedPriority = btn.dataset.priorityChoice;
        document.querySelectorAll('[data-priority-choice]').forEach(option => {
          const active = option === btn;
          option.classList.toggle('active', active);
          option.setAttribute('aria-pressed', String(active));
        });
      }));
      $('sort-select').addEventListener('change', () => { activeSort = $('sort-select').value; render(); });
      $('search-input').addEventListener('input', render);
      $('search-toggle').addEventListener('click', () => {
        const input = $('search-input');
        const toggle = $('search-toggle');
        const open = input.hidden;
        input.hidden = !open;
        toggle.setAttribute('aria-expanded', String(open));
        toggle.setAttribute('aria-label', open ? '検索を閉じる' : '検索を開く');
        if (open) input.focus();
        else { input.value = ''; render(); }
      });
      $('search-input').addEventListener('keydown', event => {
        if (event.key === 'Escape') $('search-toggle').click();
      });
      $('undo-button').addEventListener('click', () => {
        const action = undoStack.pop();
        if (!action) return;
        entries.splice(Math.min(action.index, entries.length), 0, action.entry);
        persist(); render();
        if (undoStack.length) updateUndoBanner();
        else { clearTimeout(undoTimer); $('undo-banner').hidden = true; }
      });
      const undoBanner = $('undo-banner');
      undoBanner.addEventListener('pointerdown', event => {
        if (event.pointerType !== 'touch' || event.target.closest('button')) return;
        undoSwipeStart = { pointerId: event.pointerId, x: event.clientX, y: event.clientY };
        try { undoBanner.setPointerCapture(event.pointerId); } catch {}
      });
      undoBanner.addEventListener('pointerup', event => {
        if (!undoSwipeStart || event.pointerId !== undoSwipeStart.pointerId) return;
        const dx = event.clientX - undoSwipeStart.x;
        const dy = event.clientY - undoSwipeStart.y;
        undoSwipeStart = null;
        if (dx < -55 || dy > 55) {
          clearTimeout(undoTimer);
          undoTimer = null;
          undoStack = [];
          undoBanner.hidden = true;
        }
      });
      undoBanner.addEventListener('pointercancel', () => { undoSwipeStart = null; });
      attachListGestures();
      render();
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
    }
  </script>
</body>
</html>
